# habit-tracker 静态站点 nginx 配置
# 用法：把本文件放到 /etc/nginx/conf.d/ 并替换 __DEPLOY_PATH__ 为实际网站根目录
# 或由 deploy/init-server.sh 自动替换。
server {
    listen 8080;
    # 端口 80 已被本机 Docker 容器（wordpress_ecommerce_3d）占用，故 habit-tracker 改用 8080。
    # 改成你的域名（如 habit.example.com）并释放 80 后，可改回 listen 80；仅用 IP 访问则保留 _
    server_name _;

    root __DEPLOY_PATH__;
    index index.html;

    # SPA 回退：未匹配的路径交给 index.html（本应用为单页，前端路由用 hash，可不依赖）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（文件名带 ?v= 参数时更安全）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|html)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 基础安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 关闭 access log 可减少磁盘占用（按需开启）
    # access_log off;
}

# ===== 可选：HTTPS（Let's Encrypt）=====
# 1) 安装 certbot：sudo apt-get install -y certbot python3-certbot-nginx
# 2) 把上面 server_name 改成真实域名并解析到本机 IP
# 3) 执行：sudo certbot --nginx -d habit.example.com
# certbot 会自动改写本配置加上 443 与重定向。
